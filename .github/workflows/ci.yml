# CI workflow for tui-pixel-agents

name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tui/package-lock.json
            server/package-lock.json

      - name: Install Root Dependencies
        id: install_root
        run: npm ci

      - name: Install TUI Dependencies
        id: install_tui
        working-directory: tui
        run: npm ci

      - name: Install Server Dependencies
        id: install_server
        working-directory: server
        run: npm ci

      # --- Quality Checks ---

      - name: Type Check
        id: type_check
        if: always() && steps.install_root.outcome == 'success' && steps.install_server.outcome == 'success'
        run: npm run check-types
        continue-on-error: true

      - name: Lint
        id: lint
        if: always() && steps.install_root.outcome == 'success'
        run: npm run lint
        continue-on-error: true

      - name: Format Check
        id: format_check
        if: always() && steps.install_root.outcome == 'success'
        run: npm run format:check
        continue-on-error: true

      # --- Build ---

      - name: Build TUI
        id: build
        if: always() && steps.install_tui.outcome == 'success'
        working-directory: tui
        run: npm run build
        continue-on-error: true

      # --- Tests ---

      - name: Server Tests
        id: server_test
        if: always() && steps.install_server.outcome == 'success'
        working-directory: server
        run: npm test
        continue-on-error: true

      # --- Audits ---

      - name: Audit Root Dependencies
        id: audit_root
        if: always() && steps.install_root.outcome == 'success'
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit Server Dependencies
        id: audit_server
        if: always() && steps.install_server.outcome == 'success'
        working-directory: server
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # --- Summary ---

      - name: Write Step Summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_ROOT: ${{ steps.install_root.outcome }}
          INSTALL_TUI: ${{ steps.install_tui.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
          AUDIT_ROOT: ${{ steps.audit_root.outcome }}
          AUDIT_SERVER: ${{ steps.audit_server.outcome }}
        run: |
          status() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "❌ FAIL"; fi
          }
          advisory() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "⚠️ WARN"; fi
          }
          {
            echo "## CI Results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Checkout | $(status "$CHECKOUT") |"
            echo "| Setup Node | $(status "$SETUP_NODE") |"
            echo "| Install root deps | $(status "$INSTALL_ROOT") |"
            echo "| Install TUI deps | $(status "$INSTALL_TUI") |"
            echo "| **Type check** | $(status "$TYPE_CHECK") |"
            echo "| **Lint** | $(status "$LINT") |"
            echo "| **Format check** | $(status "$FORMAT_CHECK") |"
            echo "| **Build TUI** | $(status "$BUILD") |"
            echo "| **Server tests** | $(status "$SERVER_TEST") |"
            echo "| Audit root _(advisory)_ | $(advisory "$AUDIT_ROOT") |"
            echo "| Audit server _(advisory)_ | $(advisory "$AUDIT_SERVER") |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Final Gate ---

      - name: Fail If Any Blocking Check Failed
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_ROOT: ${{ steps.install_root.outcome }}
          INSTALL_TUI: ${{ steps.install_tui.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
        run: |
          failed=0
          for step in CHECKOUT SETUP_NODE INSTALL_ROOT INSTALL_TUI \
                      TYPE_CHECK LINT FORMAT_CHECK BUILD SERVER_TEST; do
            val=$(printenv "$step" 2>/dev/null || echo "skipped")
            if [ "$val" != "success" ]; then
              echo "::error::$step failed"
              failed=1
            fi
          done
          exit "$failed"
